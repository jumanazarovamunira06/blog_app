<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Blog Platform</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@300;400;500;600;700&family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg: #f5f8ff;
    --surface: #ffffff;
    --surface2: #eaf0fb;
    --border: #c5d5f0;
    --accent: #1565c0;
    --accent2: #1976d2;
    --text: #0d1f3c;
    --muted: #546e8a;
    --danger: #c62828;
    --success: #1565c0;
    --radius: 4px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Outfit', sans-serif;
    min-height: 100vh;
    font-size: 15px;
    line-height: 1.6;
  }

  /* SIDEBAR */
  .layout { display: flex; min-height: 100vh; }

  .sidebar {
    width: 260px;
    min-height: 100vh;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    position: fixed;
    top: 0; left: 0;
    z-index: 100;
  }

  .sidebar-logo {
    padding: 32px 24px 24px;
    border-bottom: 1px solid var(--border);
  }
  .sidebar-logo h1 {
    font-family: 'Syne', sans-serif;
    font-size: 22px;
    color: var(--accent);
    letter-spacing: .5px;
  }
  .sidebar-logo span {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 2px;
    text-transform: uppercase;
    display: block;
    margin-top: 2px;
  }

  .nav { padding: 16px 12px; flex: 1; }
  .nav-section { margin-bottom: 28px; }
  .nav-label {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    padding: 0 12px;
    margin-bottom: 8px;
  }
  .nav-btn {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    padding: 9px 12px;
    background: none;
    border: none;
    border-radius: var(--radius);
    color: var(--muted);
    font-family: 'Outfit', sans-serif;
    font-size: 14px;
    cursor: pointer;
    transition: all .18s;
    text-align: left;
  }
  .nav-btn:hover { background: var(--surface2); color: var(--text); }
  .nav-btn.active { background: rgba(201,169,110,.12); color: var(--accent); }
  .nav-btn .icon { font-size: 16px; width: 20px; text-align: center; }

  /* MAIN */
  .main {
    margin-left: 260px;
    flex: 1;
    display: flex;
    flex-direction: column;
  }

  .topbar {
    padding: 20px 36px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--surface);
    position: sticky;
    top: 0;
    z-index: 50;
  }
  .page-title {
    font-family: 'Syne', sans-serif;
    font-size: 20px;
    font-weight: 400;
    color: var(--text);
  }

  .btn {
    padding: 9px 20px;
    border-radius: var(--radius);
    font-family: 'Outfit', sans-serif;
    font-size: 13px;
    cursor: pointer;
    border: none;
    transition: all .18s;
    font-weight: 500;
  }
  .btn-primary { background: var(--accent); color: #0e0e0e; }
  .btn-primary:hover { background: var(--accent2); }
  .btn-ghost { background: none; border: 1px solid var(--border); color: var(--muted); }
  .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
  .btn-danger { background: none; border: 1px solid transparent; color: var(--danger); }
  .btn-danger:hover { background: rgba(201,110,110,.1); border-color: var(--danger); }
  .btn-sm { padding: 5px 12px; font-size: 12px; }

  /* CONTENT */
  .content { padding: 32px 36px; flex: 1; }

  /* VIEWS */
  .view { display: none; }
  .view.active { display: block; }

  /* TOAST */
  #toast {
    position: fixed;
    bottom: 28px; right: 28px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    color: var(--text);
    padding: 12px 20px;
    border-radius: var(--radius);
    font-size: 13px;
    z-index: 999;
    opacity: 0;
    transform: translateY(12px);
    transition: all .3s;
    pointer-events: none;
    max-width: 320px;
  }
  #toast.show { opacity: 1; transform: translateY(0); }
  #toast.error { border-left-color: var(--danger); }
  #toast.success { border-left-color: var(--success); }

  /* MODAL */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.7);
    z-index: 200;
    display: none;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(4px);
  }
  .overlay.open { display: flex; }
  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    width: 480px;
    max-width: 95vw;
    padding: 32px;
    animation: slideUp .25s ease;
  }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .modal-title {
    font-family: 'Syne', sans-serif;
    font-size: 18px;
    margin-bottom: 24px;
    color: var(--text);
  }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 24px; }

  /* FORMS */
  .form-group { margin-bottom: 18px; }
  label {
    display: block;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 10px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 6px;
  }
  input, textarea, select {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-family: 'Outfit', sans-serif;
    font-size: 14px;
    padding: 10px 14px;
    outline: none;
    transition: border .18s;
  }
  input:focus, textarea:focus, select:focus { border-color: var(--accent); }
  textarea { resize: vertical; min-height: 100px; }
  select option { background: var(--surface2); }

  /* STATS GRID */
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 32px; }
  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 20px 24px;
    position: relative;
    overflow: hidden;
  }
  .stat-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 3px; height: 100%;
    background: var(--accent);
  }
  .stat-label {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .stat-value {
    font-family: 'Syne', sans-serif;
    font-size: 32px;
    color: var(--accent);
    line-height: 1;
  }

  /* BLOG LIST */
  .search-row { display: flex; gap: 10px; margin-bottom: 24px; }
  .search-row input { flex: 1; }

  .blog-grid { display: grid; gap: 14px; }
  .blog-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 20px 24px;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
    transition: border-color .18s, transform .18s;
    cursor: pointer;
  }
  .blog-card:hover { border-color: var(--accent); transform: translateX(2px); }
  .blog-card-body { flex: 1; min-width: 0; }
  .blog-card-title {
    font-family: 'Syne', sans-serif;
    font-size: 17px;
    margin-bottom: 4px;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .blog-card-text {
    font-size: 13px;
    color: var(--muted);
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    margin-bottom: 10px;
  }
  .blog-meta {
    display: flex;
    gap: 14px;
    align-items: center;
  }
  .meta-tag {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 10px;
    letter-spacing: 1px;
    color: var(--muted);
  }
  .meta-tag.accent { color: var(--accent); }
  .blog-card-actions { display: flex; gap: 6px; flex-shrink: 0; }

  /* USER TABLE */
  table { width: 100%; border-collapse: collapse; }
  th {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    padding: 10px 16px;
    text-align: left;
    border-bottom: 1px solid var(--border);
  }
  td {
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
    color: var(--text);
  }
  tr:hover td { background: var(--surface2); }
  .user-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(201,169,110,.1);
    color: var(--accent);
    border-radius: 999px;
    padding: 2px 10px;
    font-size: 12px;
    font-family: 'Space Grotesk', sans-serif;
  }

  /* DETAIL VIEW */
  .detail-header { margin-bottom: 28px; }
  .detail-back {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 13px; color: var(--muted);
    cursor: pointer;
    margin-bottom: 16px;
    background: none; border: none;
  }
  .detail-back:hover { color: var(--accent); }
  .detail-title {
    font-family: 'Syne', sans-serif;
    font-size: 28px;
    margin-bottom: 8px;
    color: var(--text);
  }
  .detail-body {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 28px 32px;
    font-size: 15px;
    line-height: 1.8;
    color: var(--text);
  }

  /* EMPTY STATE */
  .empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
  }
  .empty-icon { font-size: 40px; margin-bottom: 12px; }
  .empty p { font-family: 'Syne', sans-serif; font-size: 16px; margin-bottom: 6px; color: var(--text); }
  .empty small { font-size: 13px; }

  /* LOADING */
  .spinner {
    display: inline-block; width: 18px; height: 18px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-row { text-align: center; padding: 40px; }

  /* MOBILE */
  @media (max-width: 768px) {
    .sidebar { transform: translateX(-100%); transition: transform .25s; }
    .sidebar.open { transform: translateX(0); }
    .main { margin-left: 0; }
    .topbar { padding: 16px 20px; }
    .content { padding: 20px; }
    .stats { grid-template-columns: 1fr 1fr; }
    .mobile-menu-btn { display: flex !important; }
  }
  .mobile-menu-btn {
    display: none;
    background: none; border: none;
    color: var(--text); font-size: 20px;
    cursor: pointer; padding: 4px;
  }
</style>
</head>
<body>

<div class="layout">
  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <h1>BlogSpace</h1>
      <span>Admin Panel</span>
    </div>
    <nav class="nav">
      <div class="nav-section">
        <div class="nav-label">Asosiy</div>
        <button class="nav-btn active" onclick="showView('dashboard')" data-view="dashboard">
          <span class="icon">◈</span> Dashboard
        </button>
        <button class="nav-btn" onclick="showView('blogs')" data-view="blogs">
          <span class="icon">✦</span> Bloglar
        </button>
        <button class="nav-btn" onclick="showView('users')" data-view="users">
          <span class="icon">◎</span> Foydalanuvchilar
        </button>
      </div>
    </nav>
  </aside>

  <!-- MAIN -->
  <div class="main">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:14px">
        <button class="mobile-menu-btn" onclick="toggleSidebar()">☰</button>
        <span class="page-title" id="pageTitle">Dashboard</span>
      </div>
      <button class="btn btn-primary" id="topAddBtn" onclick="openAddBlogModal()" style="display:none">+ Blog qo'shish</button>
    </div>

    <div class="content">

      <!-- DASHBOARD -->
      <div class="view active" id="view-dashboard">
        <div class="stats">
          <div class="stat-card">
            <div class="stat-label">Jami bloglar</div>
            <div class="stat-value" id="stat-blogs">—</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Foydalanuvchilar</div>
            <div class="stat-value" id="stat-users">—</div>
          </div>
          <div class="stat-card" style="--accent:#6ec98a">
            <div class="stat-label">So'nggi blog</div>
            <div class="stat-value" id="stat-latest" style="font-size:16px;padding-top:6px;color:var(--success)">—</div>
          </div>
        </div>

        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
          <div style="font-family:'Playfair Display',serif;font-size:18px">So'nggi bloglar</div>
          <button class="btn btn-ghost btn-sm" onclick="showView('blogs')">Barchasini ko'rish →</button>
        </div>
        <div class="blog-grid" id="recent-blogs">
          <div class="loading-row"><div class="spinner"></div></div>
        </div>
      </div>

      <!-- BLOGS -->
      <div class="view" id="view-blogs">
        <div class="search-row">
          <input type="text" id="searchInput" placeholder="Sarlavha bo'yicha qidiring…" oninput="filterBlogs()"/>
          <input type="number" id="searchIdInput" placeholder="ID bo'yicha…" style="width:140px" oninput="filterBlogs()"/>
          <button class="btn btn-primary" onclick="openAddBlogModal()">+ Qo'shish</button>
        </div>
        <div class="blog-grid" id="blogs-list">
          <div class="loading-row"><div class="spinner"></div></div>
        </div>
      </div>

      <!-- USERS -->
      <div class="view" id="view-users">
        <div style="display:flex;justify-content:flex-end;margin-bottom:20px">
          <button class="btn btn-primary" onclick="openAddUserModal()">+ Foydalanuvchi qo'shish</button>
        </div>
        <div style="background:var(--surface);border:1px solid var(--border);border-radius:6px;overflow:hidden">
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>Ism</th>
                <th>Familiya</th>
                <th>Amallar</th>
              </tr>
            </thead>
            <tbody id="users-table">
              <tr><td colspan="4" class="loading-row"><div class="spinner"></div></td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- BLOG DETAIL -->
      <div class="view" id="view-detail">
        <button class="detail-back" onclick="showView('blogs')">← Orqaga</button>
        <div class="detail-header">
          <div class="detail-title" id="detail-title"></div>
          <div class="blog-meta">
            <span class="meta-tag accent" id="detail-author"></span>
            <span class="meta-tag" id="detail-time"></span>
          </div>
        </div>
        <div class="detail-body" id="detail-text"></div>
      </div>

    </div>
  </div>
</div>

<!-- TOAST -->
<div id="toast"></div>

<!-- ADD BLOG MODAL -->
<div class="overlay" id="addBlogOverlay">
  <div class="modal">
    <div class="modal-title" id="blogModalTitle">Yangi blog</div>
    <div class="form-group">
      <label>Sarlavha</label>
      <input type="text" id="blog-title-input" maxlength="100" placeholder="Blog sarlavhasi…"/>
    </div>
    <div class="form-group">
      <label>Matn</label>
      <textarea id="blog-text-input" maxlength="300" placeholder="Blog matni…"></textarea>
    </div>
    <div class="form-group" id="blog-user-group">
      <label>Foydalanuvchi</label>
      <select id="blog-user-input">
        <option value="">— tanlang —</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal('addBlogOverlay')">Bekor qilish</button>
      <button class="btn btn-primary" id="saveBlogBtn" onclick="saveBlog()">Saqlash</button>
    </div>
  </div>
</div>

<!-- ADD USER MODAL -->
<div class="overlay" id="addUserOverlay">
  <div class="modal">
    <div class="modal-title">Yangi foydalanuvchi</div>
    <div class="form-group">
      <label>Ism</label>
      <input type="text" id="user-first-input" maxlength="100" placeholder="Ism…"/>
    </div>
    <div class="form-group">
      <label>Familiya</label>
      <input type="text" id="user-last-input" maxlength="100" placeholder="Familiya…"/>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal('addUserOverlay')">Bekor qilish</button>
      <button class="btn btn-primary" onclick="saveUser()">Saqlash</button>
    </div>
  </div>
</div>

<!-- DELETE CONFIRM MODAL -->
<div class="overlay" id="deleteOverlay">
  <div class="modal" style="width:380px">
    <div class="modal-title" style="color:var(--danger)">Blogni o'chirish</div>
    <p style="color:var(--muted);font-size:14px">Bu amalni ortga qaytarib bo'lmaydi. Blogni o'chirishni tasdiqlaysizmi?</p>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal('deleteOverlay')">Yo'q</button>
      <button class="btn btn-danger" style="background:var(--danger);color:#fff;border:none" onclick="confirmDelete()">Ha, o'chirish</button>
    </div>
  </div>
</div>

<script>
const API = 'http://localhost:8000/api/blogs';

let allBlogs = [];
let allUsers = [];
let editingBlogId = null;
let deletingBlogId = null;

// ── NAVIGATION ──────────────────────────────────────────────
const titles = { dashboard: 'Dashboard', blogs: 'Bloglar', users: 'Foydalanuvchilar', detail: 'Blog' };

function showView(name) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.querySelector('#view-' + name).classList.add('active');
  document.getElementById('pageTitle').textContent = titles[name] || name;
  document.querySelectorAll('.nav-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.view === name);
  });
  document.getElementById('topAddBtn').style.display = name === 'blogs' ? 'inline-block' : 'none';
  if (name === 'blogs') renderBlogs();
  if (name === 'users') loadUsers();
  if (name === 'dashboard') loadDashboard();
  // close mobile sidebar
  document.getElementById('sidebar').classList.remove('open');
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
}

// ── TOAST ────────────────────────────────────────────────────
let toastTimer;
function showToast(msg, type = '') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'show ' + type;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.className = '', 3000);
}

// ── MODALS ───────────────────────────────────────────────────
function closeModal(id) {
  document.getElementById(id).classList.remove('open');
}
document.querySelectorAll('.overlay').forEach(o => {
  o.addEventListener('click', e => { if (e.target === o) o.classList.remove('open'); });
});

// ── API HELPERS ──────────────────────────────────────────────
async function apiFetch(path, options = {}) {
  const res = await fetch(API + path, {
    headers: { 'Content-Type': 'application/json' },
    ...options
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.detail || 'Xatolik yuz berdi');
  }
  return res.status === 204 ? null : res.json();
}

// ── BLOGS ────────────────────────────────────────────────────
async function loadBlogs() {
  try {
    allBlogs = await apiFetch('/');
  } catch (e) {
    showToast(e.message, 'error');
    allBlogs = [];
  }
}

async function loadUsers() {
  try {
    const data = await apiFetch('/users');
    allUsers = Array.isArray(data) ? data : [];
  } catch(e) {
    showToast('Foydalanuvchilarni yuklashda xato: ' + e.message, 'error');
    allUsers = [];
  }
  renderUsersTable();
}

function blogCard(blog, forDashboard = false) {
  const user = allUsers.find(u => u.id === blog.user_id);
  const name = user ? `${user.first_name} ${user.last_name}` : `User #${blog.user_id}`;
  const date = new Date(blog.time).toLocaleDateString('uz-UZ', { year:'numeric', month:'short', day:'numeric' });
  return `
  <div class="blog-card" onclick="showDetail(${blog.id})">
    <div class="blog-card-body">
      <div class="blog-card-title">${escHtml(blog.title)}</div>
      <div class="blog-card-text">${escHtml(blog.text)}</div>
      <div class="blog-meta">
        <span class="meta-tag accent">✦ ${escHtml(name)}</span>
        <span class="meta-tag">${date}</span>
        <span class="meta-tag">#${blog.id}</span>
      </div>
    </div>
    ${!forDashboard ? `
    <div class="blog-card-actions" onclick="event.stopPropagation()">
      <button class="btn btn-ghost btn-sm" onclick="openEditModal(${blog.id})">Tahrirlash</button>
      <button class="btn btn-danger btn-sm" onclick="askDelete(${blog.id})">O'chirish</button>
    </div>` : ''}
  </div>`;
}

async function renderBlogs() {
  const el = document.getElementById('blogs-list');
  el.innerHTML = '<div class="loading-row"><div class="spinner"></div></div>';
  await loadBlogs();
  await ensureUsers();
  filterBlogs();
}

function filterBlogs() {
  const q = document.getElementById('searchInput')?.value.toLowerCase() || '';
  const idQ = document.getElementById('searchIdInput')?.value.trim() || '';
  const filtered = allBlogs.filter(b => {
    const matchTitle = b.title.toLowerCase().includes(q);
    const matchId = idQ === '' || String(b.id) === idQ;
    return matchTitle && matchId;
  });
  const el = document.getElementById('blogs-list');
  if (!filtered.length) {
    el.innerHTML = `<div class="empty"><div class="empty-icon">✦</div><p>Blog topilmadi</p><small>Hozircha hech narsa yo'q</small></div>`;
  } else {
    el.innerHTML = filtered.map(b => blogCard(b)).join('');
  }
}

async function ensureUsers() {
  if (!allUsers.length) {
    try { allUsers = await apiFetch('/users'); } catch { allUsers = []; }
  }
}

async function loadDashboard() {
  const bEl = document.getElementById('stat-blogs');
  const uEl = document.getElementById('stat-users');
  const lEl = document.getElementById('stat-latest');
  const recEl = document.getElementById('recent-blogs');

  await loadBlogs();
  await ensureUsers();

  bEl.textContent = allBlogs.length;
  uEl.textContent = allUsers.length;

  if (allBlogs.length) {
    const latest = allBlogs[allBlogs.length - 1];
    lEl.textContent = latest.title.slice(0, 20) + (latest.title.length > 20 ? '…' : '');
    const recent = allBlogs.slice(-4).reverse();
    recEl.innerHTML = recent.map(b => blogCard(b, true)).join('');
  } else {
    lEl.textContent = '—';
    recEl.innerHTML = `<div class="empty"><div class="empty-icon">◎</div><p>Hali blog yo'q</p></div>`;
  }
}

function showDetail(id) {
  const blog = allBlogs.find(b => b.id === id);
  if (!blog) return;
  const user = allUsers.find(u => u.id === blog.user_id);
  document.getElementById('detail-title').textContent = blog.title;
  document.getElementById('detail-text').textContent = blog.text;
  document.getElementById('detail-author').textContent = user ? `${user.first_name} ${user.last_name}` : `User #${blog.user_id}`;
  document.getElementById('detail-time').textContent = new Date(blog.time).toLocaleString('uz-UZ');
  showView('detail');
}

// ── ADD / EDIT BLOG ──────────────────────────────────────────
async function openAddBlogModal() {
  editingBlogId = null;
  document.getElementById('blogModalTitle').textContent = 'Yangi blog';
  document.getElementById('blog-title-input').value = '';
  document.getElementById('blog-text-input').value = '';
  document.getElementById('blog-user-group').style.display = 'block';
  document.getElementById('saveBlogBtn').textContent = 'Saqlash';

  await ensureUsers();
  const sel = document.getElementById('blog-user-input');
  sel.innerHTML = '<option value="">— tanlang —</option>' +
    allUsers.map(u => `<option value="${u.id}">${u.first_name} ${u.last_name}</option>`).join('');

  document.getElementById('addBlogOverlay').classList.add('open');
}

async function openEditModal(id) {
  const blog = allBlogs.find(b => b.id === id);
  if (!blog) return;
  editingBlogId = id;
  document.getElementById('blogModalTitle').textContent = 'Blogni tahrirlash';
  document.getElementById('blog-title-input').value = blog.title;
  document.getElementById('blog-text-input').value = blog.text;
  document.getElementById('blog-user-group').style.display = 'none';
  document.getElementById('saveBlogBtn').textContent = 'Yangilash';
  document.getElementById('addBlogOverlay').classList.add('open');
}

async function saveBlog() {
  const title = document.getElementById('blog-title-input').value.trim();
  const text = document.getElementById('blog-text-input').value.trim();
  if (!title || !text) { showToast('Sarlavha va matn majburiy', 'error'); return; }

  const btn = document.getElementById('saveBlogBtn');
  btn.disabled = true; btn.textContent = '…';

  try {
    if (editingBlogId) {
      await apiFetch(`/id/${editingBlogId}`, { method: 'PUT', body: JSON.stringify({ title, text }) });
      showToast('Blog yangilandi', 'success');
    } else {
      const user_id = parseInt(document.getElementById('blog-user-input').value);
      if (!user_id) { showToast('Foydalanuvchi tanlang', 'error'); btn.disabled = false; btn.textContent = 'Saqlash'; return; }
      await apiFetch('/', { method: 'POST', body: JSON.stringify({ title, text, user_id }) });
      showToast('Blog qo\'shildi', 'success');
    }
    closeModal('addBlogOverlay');
    renderBlogs();
  } catch (e) {
    showToast(e.message, 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = editingBlogId ? 'Yangilash' : 'Saqlash';
  }
}

// ── DELETE ───────────────────────────────────────────────────
function askDelete(id) {
  deletingBlogId = id;
  document.getElementById('deleteOverlay').classList.add('open');
}

async function confirmDelete() {
  if (!deletingBlogId) return;
  try {
    await apiFetch(`/id/${deletingBlogId}`, { method: 'DELETE' });
    showToast('Blog o\'chirildi', 'success');
    closeModal('deleteOverlay');
    renderBlogs();
  } catch (e) {
    showToast(e.message, 'error');
  }
}

// ── USERS ────────────────────────────────────────────────────
function renderUsersTable() {
  const tbody = document.getElementById('users-table');
  if (!allUsers.length) {
    tbody.innerHTML = `<tr><td colspan="4"><div class="empty"><div class="empty-icon">◎</div><p>Foydalanuvchi yo'q</p></div></td></tr>`;
    return;
  }
  tbody.innerHTML = allUsers.map(u => `
    <tr>
      <td><span class="user-badge">#${u.id}</span></td>
      <td>${escHtml(u.first_name)}</td>
      <td>${escHtml(u.last_name)}</td>
      <td>
        <span style="font-size:12px;color:var(--muted)">
          ${allBlogs.filter(b => b.user_id === u.id).length} ta blog
        </span>
      </td>
    </tr>
  `).join('');
}

function openAddUserModal() {
  document.getElementById('user-first-input').value = '';
  document.getElementById('user-last-input').value = '';
  document.getElementById('addUserOverlay').classList.add('open');
}

async function saveUser() {
  const first_name = document.getElementById('user-first-input').value.trim();
  const last_name = document.getElementById('user-last-input').value.trim();
  if (!first_name || !last_name) { showToast('Ism va familiya majburiy', 'error'); return; }
  try {
    await apiFetch('/users', { method: 'POST', body: JSON.stringify({ first_name, last_name }) });
    showToast('Foydalanuvchi qo\'shildi', 'success');
    closeModal('addUserOverlay');
    allUsers = [];
    loadUsers();
  } catch (e) {
    showToast(e.message, 'error');
  }
}

// ── UTILS ────────────────────────────────────────────────────
function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── INIT ─────────────────────────────────────────────────────
loadDashboard();
</script>
</body>
</html>

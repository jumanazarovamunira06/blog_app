<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Blog Tizimi</title>

<style>
body { font-family: Arial; background:#f5f5f5; margin:0; }
header { background:#111; color:#fff; padding:15px; display:flex; justify-content:space-between; }
button { padding:6px 12px; cursor:pointer; }

.blog { background:#fff; margin:10px; padding:10px; border-radius:6px; }
</style>
</head>

<body>

<header>
  <h2>Blog App</h2>
  <button onclick="openCreate()">+ Yangi</button>
</header>

<div style="padding:10px;">
  <input type="text" id="search" placeholder="Qidirish..." oninput="searchBlog(this.value)">
</div>

<div id="blogs"></div>

<!-- MODAL -->
<div id="modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5);">
  <div style="background:#fff; padding:20px; width:300px; margin:100px auto;">
    <h3 id="modalTitle">Yangi</h3>
    <input id="title" placeholder="Title"><br><br>
    <textarea id="text" placeholder="Text"></textarea><br><br>
    <button onclick="save()">Saqlash</button>
    <button onclick="closeModal()">Bekor</button>
  </div>
</div>

<script>
let API = "http://127.0.0.1:8000";
let editId = null;
let allBlogs = [];

function escHtml(s) {
  return String(s)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;');
}

function formatDate(dt) {
  const d = new Date(dt);
  if (isNaN(d)) return dt;
  return d.toLocaleString();
}

async function load() {
  try {
    const r = await fetch(API + "/api/blogs/");
    if (!r.ok) throw new Error();
    allBlogs = await r.json();
    render(allBlogs);
  } catch {
    document.getElementById("blogs").innerHTML = "Server xato";
  }
}

function render(data) {
  const box = document.getElementById("blogs");
  if (!data.length) {
    box.innerHTML = "Blog yo‘q";
    return;
  }

  box.innerHTML = data.map(b => `
    <div class="blog">
      <h3>${escHtml(b.title)}</h3>
      <p>${escHtml(b.text)}</p>
      <small>${formatDate(b.time)}</small><br>
      <button onclick="edit(${b.id})">Edit</button>
      <button onclick='del(${b.id}, ${JSON.stringify(b.title)})'>Delete</button>
    </div>
  `).join("");
}

function openCreate() {
  editId = null;
  document.getElementById("modalTitle").innerText = "Yangi";
  document.getElementById("title").value = "";
  document.getElementById("text").value = "";
  document.getElementById("modal").style.display = "block";
}

function closeModal() {
  document.getElementById("modal").style.display = "none";
}

async function save() {
  const title = document.getElementById("title").value.trim();
  const text = document.getElementById("text").value.trim();

  if (!title || !text) {
    alert("To‘ldiring!");
    return;
  }

  try {
    const url = editId 
      ? `${API}/api/blogs/id/${editId}`
      : `${API}/api/blogs/`;

    const method = editId ? "PUT" : "POST";

    const r = await fetch(url, {
      method,
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ title, text })
    });

    if (!r.ok) throw new Error();

    closeModal();
    load();
  } catch {
    alert("Xato!");
  }
}

async function edit(id) {
  try {
    const r = await fetch(`${API}/api/blogs/id/${id}`);
    const b = await r.json();

    editId = id;
    document.getElementById("modalTitle").innerText = "Edit";
    document.getElementById("title").value = b.title;
    document.getElementById("text").value = b.text;

    document.getElementById("modal").style.display = "block";
  } catch {
    alert("Yuklab bo‘lmadi");
  }
}

async function del(id, title) {
  if (!confirm(title + " o‘chirilsinmi?")) return;

  try {
    await fetch(`${API}/api/blogs/id/${id}`, {
      method: "DELETE"
    });
    load();
  } catch {
    alert("Delete xato");
  }
}

async function searchBlog(val) {
  if (!val.trim()) {
    render(allBlogs);
    return;
  }

  try {
    const r = await fetch(`${API}/api/blogs/title/${encodeURIComponent(val)}`);
    if (r.status === 404) {
      render([]);
      return;
    }

    const data = await r.json();
    render(Array.isArray(data) ? data : [data]);

  } catch {
    render([]);
  }
}

// START
load();
</script>

</body>
</html>
